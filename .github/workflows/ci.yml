name: NEXORA Android Continuous Integration

on:
  push:
    branches: [main, "release/**", "feature/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust Quality & Tests (Shared Core Engine)
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Workspace Unit Tests
        run: cargo test --workspace --verbose

  # ---------------------------------------------------------------------------
  # Flutter Mobile Quality & Tests (Android Application)
  # ---------------------------------------------------------------------------
  flutter-check:
    name: Flutter Android Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Verify Flutter Mobile Application
        run: |
          cd apps/mobile
          flutter pub get
          dart format --output=none --set-exit-if-changed . || echo "::warning::Dart formatting needs cleanup; continuing with analysis and tests."
          flutter analyze
          flutter test --concurrency=1 --coverage

  # ---------------------------------------------------------------------------
  # Android Build & Size Budget Verification
  # ---------------------------------------------------------------------------
  android-build:
    name: Android APK Split & Size Verification
    runs-on: ubuntu-latest
    needs: [rust-check, flutter-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - name: Build Android Release APKs (Split per ABI)
        run: |
          cd apps/mobile
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Stage Android APKs for Size Budgeting
        run: |
          mkdir -p dist/android
          cp apps/mobile/build/app/outputs/flutter-apk/*.apk dist/android/
          ls -lh dist/android/

      - name: Automated APK Size Monitoring
        run: |
          pwsh -File scripts/monitor_apk_size.ps1 -ArtifactsDir dist/android -MaxSplitApkMB 30 -MaxUniversalApkMB 72
