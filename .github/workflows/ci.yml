name: NEXORA Continuous Integration

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust Quality & Tests
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Workspace Unit Tests
        run: cargo test --workspace --verbose

  # ---------------------------------------------------------------------------
  # Flutter Quality & Tests
  # ---------------------------------------------------------------------------
  flutter-check:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Verify Flutter Mobile
        run: |
          cd apps/mobile
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --coverage

      - name: Verify Flutter Desktop
        run: |
          cd apps/desktop
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test

  # ---------------------------------------------------------------------------
  # Android Build Verification
  # ---------------------------------------------------------------------------
  android-build:
    name: Android APK Build
    runs-on: ubuntu-latest
    needs: [rust-check, flutter-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - name: Build Android APK (Debug)
        run: |
          cd apps/mobile
          flutter pub get
          flutter build apk --debug
