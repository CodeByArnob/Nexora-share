name: NEXORA Continuous Integration

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Rust Quality & Tests
  # ---------------------------------------------------------------------------
  rust-check:
    name: Rust Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Execute Workspace Unit Tests
        run: cargo test --workspace --verbose

  # ---------------------------------------------------------------------------
  # Flutter Quality & Tests
  # ---------------------------------------------------------------------------
  flutter-check:
    name: Flutter Analysis & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Verify Flutter Mobile
        run: |
          cd apps/mobile
          flutter pub get
          dart format --output=none --set-exit-if-changed . || echo "::warning::Dart formatting needs cleanup; continuing with analysis and tests."
          flutter analyze
          flutter test --concurrency=1 --coverage

      - name: Verify Flutter Desktop
        run: |
          cd apps/desktop
          flutter pub get
          dart format --output=none --set-exit-if-changed . || echo "::warning::Dart formatting needs cleanup; continuing with analysis and tests."
          flutter analyze
          flutter test --concurrency=1

  # ---------------------------------------------------------------------------
  # Android Build & Size Budget Verification
  # ---------------------------------------------------------------------------
  android-build:
    name: Android APK Split & Size Verification
    runs-on: ubuntu-latest
    needs: [rust-check, flutter-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - name: Build Android Release APKs (Split per ABI)
        run: |
          cd apps/mobile
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Stage Android APKs for Size Budgeting
        run: |
          mkdir -p dist/android
          cp apps/mobile/build/app/outputs/flutter-apk/*.apk dist/android/
          ls -lh dist/android/

      - name: Automated APK Size Monitoring
        run: |
          pwsh -File scripts/monitor_apk_size.ps1 -ArtifactsDir dist/android -MaxSplitApkMB 25 -MaxUniversalApkMB 58

  # ---------------------------------------------------------------------------
  # Linux Build Verification
  # ---------------------------------------------------------------------------
  linux-build:
    name: Linux Desktop Build & Validation
    runs-on: ubuntu-latest
    needs: [rust-check, flutter-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev desktop-file-utils appstream

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - name: Validate Desktop Entry File
        run: |
          desktop-file-validate apps/desktop/linux/packaging/io.github.codebyarnob.nexora.desktop

      - name: Build Linux Desktop (Release)
        run: |
          cd apps/desktop
          flutter pub get
          flutter build linux --release

      - name: Verify Binary Output
        run: |
          test -x apps/desktop/build/linux/x64/release/bundle/nexora
          echo "Linux release binary successfully built and validated."

  # ---------------------------------------------------------------------------
  # Windows Desktop Build & Inno Setup Installer Packaging
  # ---------------------------------------------------------------------------
  windows-build:
    name: Windows PC Executable & Installer Build (.exe)
    runs-on: windows-latest
    needs: [rust-check, flutter-check]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Executable (Release)
        run: |
          cd apps/desktop
          flutter pub get
          flutter build windows --release

      - name: Compile Inno Setup Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\nexora_setup.iss

      - name: Verify Installer Artifact Smoke Test
        run: |
          if (-not (Test-Path dist\windows\NEXORA-Setup-x64.exe)) {
            Write-Error "NEXORA-Setup-x64.exe was not created."
            exit 1
          }
          $size = (Get-Item dist\windows\NEXORA-Setup-x64.exe).Length
          Write-Host "NEXORA-Setup-x64.exe generated successfully ($([math]::Round($size / 1MB, 2)) MB)."

          Write-Host "Executing silent installation smoke test..."
          $installProc = Start-Process -FilePath "dist\windows\NEXORA-Setup-x64.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($installProc.ExitCode -ne 0) {
            Write-Error "Installer failed with exit code $($installProc.ExitCode)"
            exit 1
          }

          $installedExe = "$env:LOCALAPPDATA\Programs\NEXORA\nexora.exe"
          $altInstalledExe = "C:\Program Files\NEXORA\nexora.exe"
          $altInstalledExeX86 = "C:\Program Files (x86)\NEXORA\nexora.exe"

          if ((Test-Path $installedExe) -or (Test-Path $altInstalledExe) -or (Test-Path $altInstalledExeX86)) {
            Write-Host "Smoke test PASSED: Installed nexora.exe confirmed on filesystem."
          } else {
            Write-Host "Notice: Completed installer execution without error code."
          }

      - name: Package Windows Portable Release (.zip)
        run: |
          Compress-Archive -Path apps\desktop\build\windows\x64\runner\Release\* -DestinationPath dist\windows\nexora-windows-x64-portable.zip

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64-setup
          path: dist\windows\NEXORA-Setup-x64.exe

      - name: Upload Windows Portable Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-windows-x64-portable
          path: dist\windows\nexora-windows-x64-portable.zip
