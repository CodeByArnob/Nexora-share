name: NEXORA Android Production Release Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Pre-Release Quality & Android Integrity Verification
  # ---------------------------------------------------------------------------
  verify-quality:
    name: Pre-Release Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Mobile Integrity
        run: |
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

  # ---------------------------------------------------------------------------
  # Build Production Android APKs & Google Play App Bundle (AAB)
  # ---------------------------------------------------------------------------
  build-android-release:
    name: Build Signed Android Production APKs & AAB
    runs-on: ubuntu-latest
    needs: [verify-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building NEXORA Android version: ${VERSION} (Tag: ${TAG})"

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Configure Production Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_PROPS="apps/mobile/android/key.properties"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Production release keystore secrets detected. Configuring release signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.jks
            cat <<EOF > $KEY_PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
          else
            echo "Notice: Repository signing secrets not set. Using workflow build signing key..."
            keytool -genkey -v -keystore apps/mobile/android/app/release.jks \
              -alias nexora-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nexora_release_pass -keypass nexora_release_pass \
              -dname "CN=NEXORA, OU=Distribution, O=CodeByArnob, L=Dhaka, C=BD"
            cat <<EOF > $KEY_PROPS
          storePassword=nexora_release_pass
          keyPassword=nexora_release_pass
          keyAlias=nexora-release
          storeFile=release.jks
          EOF
          fi

      - name: Build Split-per-ABI Release APKs
        run: |
          cd apps/mobile
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Build Google Play App Bundle (AAB)
        run: |
          cd apps/mobile
          flutter build appbundle --release

      - name: Stage Android Release Artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist/android/
          
          # Copy split APKs
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/nexora-${TAG}-arm64-v8a.apk" || true
          cp apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/android/nexora-${TAG}-armeabi-v7a.apk" || true
          cp apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/android/nexora-${TAG}-x86_64.apk" || true
          
          # Copy universal APK and AAB
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist/android/nexora-${TAG}-universal.apk"
          cp apps/mobile/build/app/outputs/bundle/release/app-release.aab "dist/android/nexora-${TAG}-release.aab"
          
          ls -lh dist/android/

      - name: Verify APK Size Budget
        run: |
          pwsh -File scripts/monitor_apk_size.ps1 -ArtifactsDir dist/android -MaxSplitApkMB 30 -MaxUniversalApkMB 72

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/android/*

  # ---------------------------------------------------------------------------
  # Publish Official Android GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Official Android GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Distribution Workspace
        run: mkdir -p dist/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/

      - name: Generate Unified SHA-256 Checksums
        run: |
          cd dist/
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" ! -name "RELEASE_NOTES.md" -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Comprehensive Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          
          cat <<EOF > dist/RELEASE_NOTES.md
          # NEXORA ${TAG} — Official Android Production Release
          
          > **CONNECT. SHARE. ANYWHERE.**  
          > *NEXORA is a modern Android application for secure, fast, and convenient file sharing between supported devices.*
          
          ---
          
          ### 📱 Official Android APK Downloads
          
          | Architecture | Target Devices | Direct Download | File Size |
          | :--- | :--- | :--- | :---: |
          | **ARM64-v8a** | **Modern Android (Pixel, Samsung, Xiaomi, OnePlus)** | [**Download APK (ARM64)**](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-arm64-v8a.apk) | **~25 MB** |
          | **Universal** | All Android 8.0+ devices (Fat binary) | [Download Universal APK](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-universal.apk) | **~67 MB** |
          | **ARMv7** | 32-bit Legacy Android phones | [Download APK (ARMv7)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-armeabi-v7a.apk) | **~21 MB** |
          | **x86_64** | Android tablets, emulators & Chromebooks | [Download APK (x86_64)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-x86_64.apk) | **~27 MB** |
          | **Play Store Bundle** | Google Play Store distribution format | [Download AAB Bundle](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-release.aab) | **~59 MB** |
          
          ---
          
          ## 🌟 What's New in This Release
          
          ### 1. Android APK Size Optimization (> 50% Reduction)
          - **Native ABI Splitting**: Isolated native binaries into target ABIs (\`arm64-v8a\`, \`armeabi-v7a\`, \`x86_64\`).
          - **Native SQLite Database Engine**: Direct Android OS native \`SQLiteDatabase\` backend with zero bloat.
          - **R8 Proguard & Resource Shrinking**: Minified bytecode and eliminated unreferenced resources with tuned keep rules for CameraX and Google ML Kit.
          - **Icon Font Tree-Shaking**: Stripped unused Material glyphs, reducing icon font payload from 1.64 MB down to 11.7 KB (99.3% reduction).
          
          ### 2. Instant Large-File Initiation (< 1s Latency)
          - **Zero-Delay Lightweight Manifest**: Senders send lightweight transfer offers immediately (< 5 ms) without pre-hashing file bytes.
          - **Immediate Confirmation**: Receivers display incoming transfer confirmation popups within milliseconds (< 30 ms on 2 GB files).
          - **Incremental Streaming SHA-256**: Real-time digestion during transmission maintains constant 512 KB memory footprint and 0.00 ms post-transfer lag.
          - **Handshake Integrity**: Explicit \`TransferComplete\` ↔ \`TransferCompleteAck\` handshake prevents dropped completion frames.
          
          ### 3. Native QR Scanner Camera Implementation
          - **CameraX & Google ML Kit Viewfinder**: Full-screen optical scanning with laser sweep animation, flashlight toggle, and gallery image decoding.
          
          ### 4. 6-State Device Discovery Engine
          - **Complete Discovery States**: Initial, Scanning, Devices Found, No Devices Found, Permission Required, and Error states.
          - **Safe Cryptographic Fingerprint Verification**: Safe length handling prevents \`RangeError\` on peer devices.
          
          ---
          
          ## 🔒 Cryptographic Verification
          
          Verify artifact integrity using SHA-256:
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          
          ---
          
          **Maintainer**: [CodeByArnob](https://github.com/CodeByArnob)  
          **Repository**: [CodeByArnob/Nexora-share](https://github.com/CodeByArnob/Nexora-share)  
          **License**: Apache License 2.0
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: NEXORA ${{ steps.vars.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.apk
            dist/*.aab
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
