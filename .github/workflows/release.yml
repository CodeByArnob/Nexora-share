name: NEXORA Windows Desktop Release Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.3)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Pre-Release Quality & Cross-Platform Integrity Verification
  # ---------------------------------------------------------------------------
  verify-quality:
    name: Pre-Release Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Mobile Integrity
        run: |
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

      - name: Verify Flutter Desktop Integrity
        run: |
          cd apps/desktop
          flutter pub get
          flutter analyze
          flutter test --concurrency=1

  # ---------------------------------------------------------------------------
  # Build Production Windows Installer & Portable Bundle (TARGET: WINDOWS ONLY)
  # ---------------------------------------------------------------------------
  build-windows-release:
    name: Build Windows x64 Installer & Portable Bundle
    runs-on: windows-latest
    needs: [verify-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building NEXORA Windows version: $version (Tag: $tag)"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Executable (Release)
        run: |
          cd apps/desktop
          flutter pub get
          flutter build windows --release

      - name: Compile Inno Setup Windows Installer
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\nexora_setup.iss
          # Provide both canonical NEXORA-Setup-x64.exe and version-tagged installer
          Copy-Item -Force dist\windows\NEXORA-Setup-x64.exe "dist\windows\NEXORA-${tag}-Setup-x64.exe"

      - name: Package Windows Portable ZIP Bundle
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          Compress-Archive -Path apps\desktop\build\windows\x64\runner\Release\* -DestinationPath "dist\windows\nexora-windows-x64-portable.zip"
          Copy-Item -Force "dist\windows\nexora-windows-x64-portable.zip" "dist\windows\nexora-${tag}-windows-x64-portable.zip"

      - name: Verify Windows Release Artifacts Smoke Test
        run: |
          $setupCanonical = "dist\windows\NEXORA-Setup-x64.exe"
          $setupTagged = "dist\windows\NEXORA-${{ steps.vars.outputs.tag }}-Setup-x64.exe"
          $zip = "dist\windows\nexora-windows-x64-portable.zip"
          if (-not (Test-Path $setupCanonical)) { Write-Error "Missing canonical installer $setupCanonical"; exit 1 }
          if (-not (Test-Path $setupTagged)) { Write-Error "Missing tagged installer $setupTagged"; exit 1 }
          if (-not (Test-Path $zip)) { Write-Error "Missing portable zip $zip"; exit 1 }
          Write-Host "Windows artifacts validated successfully."

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/windows/*

  # ---------------------------------------------------------------------------
  # Publish Official GitHub Release (Windows Desktop Target Only)
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows-release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Distribution Workspace
        run: mkdir -p dist/

      - name: Download Windows Artifacts Only
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/

      - name: Generate Windows SHA-256 Checksums
        run: |
          cd dist/
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" ! -name "RELEASE_NOTES.md" -exec sha256sum {} + | sed 's|\./||' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Comprehensive Windows Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          
          cat <<EOF > dist/RELEASE_NOTES.md
          # NEXORA ${TAG} — Windows Desktop Official Release
          
          > **CONNECT. SHARE. ANYWHERE.**  
          > *PRIVATE BY DESIGN. OPEN BY NATURE.*
          
          ---
          
          ### 🚀 Official Windows Desktop Downloads
          
          - **[Download NEXORA Windows Setup (.exe)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/NEXORA-Setup-x64.exe)** *(Recommended: Full Installer with branded icons, Start Menu & Desktop shortcuts, and automated firewall rules)*
          - **[Download NEXORA Windows Tagged Installer (.exe)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/NEXORA-${TAG}-Setup-x64.exe)**
          - **[Download NEXORA Windows Portable (.zip)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-windows-x64-portable.zip)** *(Standalone archive — extract and run immediately without installation)*
          - **[Download NEXORA Windows Tagged Portable (.zip)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-windows-x64-portable.zip)**
          
          ---
          
          ## 🌟 What's New in This Release
          
          ### 1. Instant Large-File Initiation (< 1s Latency)
          - **Lightweight Manifest Protocol**: Sender immediately sends lightweight transfer metadata without blocking on upfront whole-file hashing.
          - **Receiver Instant Prompt**: Receiver displays incoming transfer confirmation within milliseconds (< 20 ms benchmarked on 2 GB files).
          - **Streaming On-the-Fly SHA-256**: Incremental hashing occurs during chunk transmission with constant 512 KB memory footprint and 0.00 ms post-transfer verification lag.
          
          ### 2. High-Resolution Branded Windows Application Icon
          - **Multi-Resolution ICO Asset**: Embedded 16x16, 24x24, 32x32, 48x48, 64x64, 128x128, and 256x256 32-bit RGBA icons.
          - **Full System Integration**: Official branding in Taskbar, Windows Explorer, Start Menu, Desktop shortcuts, Add or Remove Programs, and Inno Setup installer.
          
          ### 3. File Transfer Lifecycle & State Machine Stability
          - **Transfer Completion & Integrity Verification**: Immediate transition to \`Completed\` upon verified SHA-256 confirmation with \`TransferCompleteAck\`.
          - **Clean Resource Management**: Guaranteed release of file locks, socket descriptors, and background transfer handles upon completion or cancellation.
          
          ---
          
          ## 🔒 Cryptographic Verification
          
          Verify artifact integrity using SHA-256:
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          
          ---
          
          **Maintainer**: [CodeByArnob](https://github.com/CodeByArnob)  
          **Repository**: [CodeByArnob/Nexora-share](https://github.com/CodeByArnob/Nexora-share)  
          **License**: Apache License 2.0
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: NEXORA ${{ steps.vars.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
