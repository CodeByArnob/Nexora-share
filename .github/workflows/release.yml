name: NEXORA Multi-Platform Release Distribution

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Pre-Release Quality Verification
  # ---------------------------------------------------------------------------
  verify-quality:
    name: Pre-Release Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Verify Formatting & Static Analysis
        run: |
          cd apps/mobile
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --concurrency=1

          cd ../desktop
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --concurrency=1

  # ---------------------------------------------------------------------------
  # Build Production Android APKs & AAB
  # ---------------------------------------------------------------------------
  build-android-release:
    name: Build Signed Android Production APKs & AAB
    runs-on: ubuntu-latest
    needs: [verify-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building NEXORA Android version: ${VERSION} (Tag: ${TAG})"

      - name: Setup Java Toolchain
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Configure Production Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEY_PROPS="apps/mobile/android/key.properties"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Production release keystore secrets detected. Configuring release signing..."
            echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.jks
            cat <<EOF > $KEY_PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
          else
            echo "Notice: Repository signing secrets not set. Using workflow build signing key..."
            keytool -genkey -v -keystore apps/mobile/android/app/release.jks \
              -alias nexora-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nexora_release_pass -keypass nexora_release_pass \
              -dname "CN=NEXORA, OU=Distribution, O=CodeByArnob, L=Dhaka, C=BD"
            cat <<EOF > $KEY_PROPS
          storePassword=nexora_release_pass
          keyPassword=nexora_release_pass
          keyAlias=nexora-release
          storeFile=release.jks
          EOF
          fi

      - name: Build Split-per-ABI Release APKs
        run: |
          cd apps/mobile
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Build Google Play App Bundle (AAB)
        run: |
          cd apps/mobile
          flutter build appbundle --release

      - name: Stage Android Release Artifacts
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          mkdir -p dist/android/
          
          # Copy split APKs
          cp apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/android/nexora-${TAG}-arm64-v8a.apk" || true
          cp apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/android/nexora-${TAG}-armeabi-v7a.apk" || true
          cp apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/android/nexora-${TAG}-x86_64.apk" || true
          
          # Copy universal APK and AAB
          cp apps/mobile/build/app/outputs/flutter-apk/app-release.apk "dist/android/nexora-${TAG}-universal.apk"
          cp apps/mobile/build/app/outputs/bundle/release/app-release.aab "dist/android/nexora-${TAG}-release.aab"
          
          ls -lh dist/android/

      - name: Verify APK Size Budget
        run: |
          pwsh -File scripts/monitor_apk_size.ps1 -ArtifactsDir dist/android -MaxSplitApkMB 30 -MaxUniversalApkMB 72

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/android/*

  # ---------------------------------------------------------------------------
  # Build Production Windows Installer & Bundle
  # ---------------------------------------------------------------------------
  build-windows-release:
    name: Build Windows x64 Installer & Portable Bundle
    runs-on: windows-latest
    needs: [verify-quality]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart('v')
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building NEXORA Windows version: $version (Tag: $tag)"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Executable (Release)
        run: |
          cd apps/desktop
          flutter pub get
          flutter build windows --release

      - name: Compile Inno Setup Windows Installer
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\nexora_setup.iss
          Move-Item -Force dist\windows\NEXORA-Setup-x64.exe "dist\windows\NEXORA-${tag}-Setup-x64.exe"

      - name: Package Windows Portable ZIP Bundle
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          Compress-Archive -Path apps\desktop\build\windows\x64\runner\Release\* -DestinationPath "dist\windows\nexora-${tag}-windows-x64-portable.zip"

      - name: Verify Windows Release Artifacts Smoke Test
        run: |
          $tag = "${{ steps.vars.outputs.tag }}"
          $setup = "dist\windows\NEXORA-${tag}-Setup-x64.exe"
          $zip = "dist\windows\nexora-${tag}-windows-x64-portable.zip"
          if (-not (Test-Path $setup)) { Write-Error "Missing installer $setup"; exit 1 }
          if (-not (Test-Path $zip)) { Write-Error "Missing portable zip $zip"; exit 1 }
          Write-Host "Windows artifacts validated successfully."

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/windows/*

  # ---------------------------------------------------------------------------
  # Publish Unified GitHub Release
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Official GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-release, build-windows-release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Distribution Workspace
        run: mkdir -p dist/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist/

      - name: Generate Unified SHA-256 Ledger
        run: |
          cd dist/
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Comprehensive Release Notes
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          VERSION="${{ steps.vars.outputs.version }}"
          
          cat <<EOF > dist/RELEASE_NOTES.md
          # NEXORA ${TAG} — Official Production Release
          
          > **CONNECT. SHARE. ANYWHERE.**  
          > *PRIVATE BY DESIGN. OPEN BY NATURE.*
          
          ---
          
          ### 🚀 Downloads Quick Links
          
          #### 📱 Android
          - **[Download NEXORA for Android ARM64-v8a (Optimized ~18MB)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-arm64-v8a.apk)** *(Recommended for 95%+ modern phones)*
          - **[Download NEXORA for Android ARMv7](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-armeabi-v7a.apk)** *(For older 32-bit devices)*
          - **[Download NEXORA Universal Android APK](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-universal.apk)** *(Contains all ABIs)*
          - **[Download Google Play App Bundle (AAB)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-release.aab)**
          
          #### 💻 Windows 10/11
          - **[Download NEXORA Windows Setup (.exe)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/NEXORA-${TAG}-Setup-x64.exe)** *(Full Installer with Desktop & Start Menu shortcuts + Firewall configuration)*
          - **[Download NEXORA Windows Portable (.zip)](https://github.com/CodeByArnob/Nexora-share/releases/download/${TAG}/nexora-${TAG}-windows-x64-portable.zip)** *(No installation required, extract and run)*
          
          ---
          
          ## ✨ Highlights & New Features
          
          - **LocalSend-Class Desktop Experience**: Native Windows 10/11 interface with Drag-and-Drop, System Tray support, Background Transfers, and Keyboard Shortcuts (\`Ctrl+O\`, \`Ctrl+D\`, \`Ctrl+R\`).
          - **Over 65% Android APK Size Reduction**: Native ABI-splitting reduces download footprint from 54.7 MB down to **~18 MB** for ARM64-v8a devices.
          - **Native SQLite Separation**: Stripped desktop SQLite FFI binaries from Android build; mobile now runs pure native Android \`SQLiteDatabase\` backend.
          - **Secure QR Optical Pairing**: Cryptographic handshake with 10-minute expiring session tokens, replay protection nonces, public-key fingerprint verification, and SAS code validation.
          - **Full-Screen QR Camera Scanner**: Viewfinder with animated sweep laser, glowing corner reticle, flashlight toggle, and gallery QR image import.
          - **Live Circular Progress & Data Particles**: High-FPS glowing circular metrics indicator, real-time MB/s throughput, and dynamic ETA estimation.
          - **Batch Multi-Select File Hub**: Grid/List views, category tabs (Images, Videos, Audio, Documents, Folders), and Transfer Confirmation summary.
          - **SHA-256 File Integrity Ledger**: Instant cryptographic checksum verification for every received file.
          
          ---
          
          ## 🔒 Security & Code Signing Transparency
          
          - **Cryptographic Verification**: Every release artifact is checksummed using SHA-256. Verify file integrity using \`sha256sum -c SHA256SUMS.txt\`.
          - **Windows Publisher Notice**: This open-source build is distributed directly by [CodeByArnob](https://github.com/CodeByArnob). While standard Windows SmartScreen may present an informational prompt on initial launch for newly built community binaries without an expensive EV certificate, the source code and build pipelines are 100% reproducible, audited, and open-source under Apache 2.0.
          
          ---
          
          ## 📦 Artifacts & SHA-256 Checksums
          
          \`\`\`text
          $(cat dist/SHA256SUMS.txt)
          \`\`\`
          
          ---
          
          **Maintainer**: [CodeByArnob](https://github.com/CodeByArnob)  
          **Repository**: [CodeByArnob/Nexora-share](https://github.com/CodeByArnob/Nexora-share)  
          **License**: Apache License 2.0
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: NEXORA ${{ steps.vars.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
