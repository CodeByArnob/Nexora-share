<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14243B" />
      <stop offset="100%" stop-color="#0E1726" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3978F6" />
      <stop offset="100%" stop-color="#39C6B0" />
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <style>
      .step-num { font-family: -apple-system, sans-serif; font-weight: 900; font-size: 28px; }
      .step-title { font-family: -apple-system, sans-serif; font-weight: 700; font-size: 16px; fill: #FFFFFF; }
      .step-desc { font-family: -apple-system, sans-serif; font-weight: 400; font-size: 12.5px; fill: #94A9C9; }
      .flow-arrow { stroke-dasharray: 6 6; animation: dash 2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -12; } }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="#090E17" stroke="#1E314D" stroke-width="1.5" />

  <!-- Connecting Data Stream Flow -->
  <line class="flow-arrow" x1="280" y1="160" x2="350" y2="160" stroke="url(#beamGrad)" stroke-width="3" />
  <polygon points="352,160 342,154 342,166" fill="#39C6B0" />

  <line class="flow-arrow" x1="610" y1="160" x2="680" y2="160" stroke="url(#beamGrad)" stroke-width="3" />
  <polygon points="682,160 672,154 672,166" fill="#39C6B0" />

  <!-- ==================== CARD 1: DISCOVERY ==================== -->
  <g transform="translate(40, 45)" filter="url(#cardGlow)">
    <rect width="250" height="230" rx="14" fill="url(#cardBg)" stroke="#22395C" stroke-width="1.5" />
    <circle cx="48" cy="48" r="22" fill="#1C2F4D" stroke="#3978F6" stroke-width="2" />
    <text x="40" y="58" class="step-num" fill="#3978F6">1</text>
    <text x="86" y="54" class="step-title">Zero-Config Discovery</text>
    <text x="24" y="96" class="step-desc">• UDP Multicast (224.0.0.167)</text>
    <text x="24" y="122" class="step-desc">• Subnet Broadcast (192.168.x.255)</text>
    <text x="24" y="148" class="step-desc">• Native Android MulticastLock</text>
    <text x="24" y="174" class="step-desc">• Direct IP &amp; QR Code Fallback</text>
    <rect x="24" y="196" width="130" height="22" rx="4" fill="#162B4A" />
    <text x="32" y="211" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#39C6B0">⚡ &lt; 100ms Peer Echo</text>
  </g>

  <!-- ==================== CARD 2: LIGHTWEIGHT MANIFEST ==================== -->
  <g transform="translate(370, 45)" filter="url(#cardGlow)">
    <rect width="250" height="230" rx="14" fill="url(#cardBg)" stroke="#22395C" stroke-width="1.5" />
    <circle cx="48" cy="48" r="22" fill="#1C2F4D" stroke="#39A0F6" stroke-width="2" />
    <text x="40" y="58" class="step-num" fill="#39A0F6">2</text>
    <text x="86" y="54" class="step-title">TransferOffer Handshake</text>
    <text x="24" y="96" class="step-desc">• Session ID &amp; Sender Keypair</text>
    <text x="24" y="122" class="step-desc">• File Count, Sizes &amp; MIME Types</text>
    <text x="24" y="148" class="step-desc">• Zero Pre-Transfer Hashing Lag</text>
    <text x="24" y="174" class="step-desc">• Receiver Explicit Confirmation</text>
    <rect x="24" y="196" width="145" height="22" rx="4" fill="#162B4A" />
    <text x="32" y="211" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#39A0F6">⏱️ 18-31ms Prompt SLA</text>
  </g>

  <!-- ==================== CARD 3: BOUNDED STREAMING ==================== -->
  <g transform="translate(700, 45)" filter="url(#cardGlow)">
    <rect width="260" height="230" rx="14" fill="url(#cardBg)" stroke="#22395C" stroke-width="1.5" />
    <circle cx="48" cy="48" r="22" fill="#1C2F4D" stroke="#39C6B0" stroke-width="2" />
    <text x="40" y="58" class="step-num" fill="#39C6B0">3</text>
    <text x="86" y="54" class="step-title">Bounded 1MB Streaming</text>
    <text x="24" y="96" class="step-desc">• 1MB Chunk Slicing + Backpressure</text>
    <text x="24" y="122" class="step-desc">• Streaming On-The-Fly SHA-256</text>
    <text x="24" y="148" class="step-desc">• Foreground Service WakeLock</text>
    <text x="24" y="174" class="step-desc">• Two-Way TransferCompleteAck</text>
    <rect x="24" y="196" width="155" height="22" rx="4" fill="#162B4A" />
    <text x="32" y="211" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#39C6B0">🛡️ 0.00ms Verification Lag</text>
  </g>
</svg>