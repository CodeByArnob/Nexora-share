<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0E1E38" />
      <stop offset="100%" stop-color="#001F3F" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00BFA5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing orbital orbit -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00E5FF" stroke-width="6" stroke-dasharray="16 12" opacity="0.35" />
  
  <!-- Intersecting Transmission Arcs -->
  <path d="M 176 176 Q 256 120 336 176" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  <path d="M 176 336 Q 256 392 336 336" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- Central Transmission Nexus -->
  <g filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="256" cy="256" r="44" fill="url(#primaryGrad)" />
    <circle cx="256" cy="256" r="22" fill="#0A1128" />
    <circle cx="256" cy="256" r="10" fill="#00E5FF" />
    
    <!-- West Peer Node -->
    <circle cx="160" cy="256" r="26" fill="#00E5FF" />
    <line x1="186" y1="256" x2="212" y2="256" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    
    <!-- East Peer Node -->
    <circle cx="352" cy="256" r="26" fill="#00BFA5" />
    <line x1="300" y1="256" x2="326" y2="256" stroke="#00BFA5" stroke-width="8" stroke-linecap="round" />

    <!-- North Peer Node -->
    <circle cx="256" cy="160" r="22" fill="#00E5FF" opacity="0.9" />
    <line x1="256" y1="182" x2="256" y2="212" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />

    <!-- South Peer Node -->
    <circle cx="256" cy="352" r="22" fill="#00BFA5" opacity="0.9" />
    <line x1="256" y1="300" x2="256" y2="330" stroke="#00BFA5" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
