<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3978F6" />
      <stop offset="100%" stop-color="#39C6B0" />
    </linearGradient>
  </defs>
  <!-- Geometric "N" Symbol on Light Surface -->
  <g>
    <!-- Diagonal Dynamic Transfer Path -->
    <path d="M 160 160 L 352 352" stroke="url(#flowLight)" stroke-width="44" stroke-linecap="round" />

    <!-- Left Stem: Sender Column -->
    <line x1="160" y1="160" x2="160" y2="352" stroke="#14243B" stroke-width="44" stroke-linecap="round" />

    <!-- Right Stem: Receiver Column -->
    <line x1="352" y1="160" x2="352" y2="352" stroke="#39C6B0" stroke-width="44" stroke-linecap="round" />

    <!-- Sender Device Node (Upper Left) -->
    <circle cx="160" cy="160" r="32" fill="#F5F7FB" stroke="#14243B" stroke-width="12" />
    <circle cx="160" cy="160" r="12" fill="#3978F6" />

    <!-- Receiver Device Node (Lower Right) -->
    <circle cx="352" cy="352" r="32" fill="#F5F7FB" stroke="#39C6B0" stroke-width="12" />
    <circle cx="352" cy="352" r="12" fill="#39C6B0" />

    <circle cx="256" cy="256" r="10" fill="#14243B" opacity="0.9" />
  </g>
</svg>
